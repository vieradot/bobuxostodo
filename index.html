<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>to-do dos bobuxos</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap');

:root {
  --paper: #e9e5dc;
  --ink: #191916;
  --muted: #77736a;
  --line: #bdb9af;
  --red: #8d3029;
  --white: #f5f2eb;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "DM Mono", monospace;
}

main {
  width: min(1000px, calc(100% - 32px));
  margin: auto;
  padding: 45px 0 70px;
}

/* HEADER */

header {
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  padding: 22px 0;
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
}

h1 {
  font-family: "Libre Baskerville", serif;
  font-weight: 400;
  font-size: clamp(40px, 7vw, 70px);
  letter-spacing: -0.055em;
  line-height: .95;
  margin: 0;
}

h1 em {
  color: var(--red);
}

.header-date {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.7;
  text-align: right;
}

/* INTRO */

.intro {
  padding: 24px 0 32px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 30px;
}

.intro p {
  font-family: "Libre Baskerville", serif;
  font-style: italic;
  line-height: 1.7;
  font-size: 14px;
  max-width: 520px;
  margin: 0;
}

.stats {
  display: flex;
  gap: 28px;
  align-items: end;
}

.stat strong {
  display: block;
  font-family: "Libre Baskerville", serif;
  font-weight: 400;
  font-size: 27px;
}

.stat span {
  color: var(--muted);
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: .08em;
}

/* TOOLBAR */

.toolbar {
  border-bottom: 1px solid var(--line);
  padding: 15px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.filter {
  font: inherit;
  font-size: 9px;
  padding: 7px 9px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted);
  cursor: pointer;
}

.filter:hover,
.filter.active {
  border-color: var(--ink);
  color: var(--ink);
}

.add {
  background: var(--ink);
  color: var(--paper);
  border: 1px solid var(--ink);
  font: inherit;
  font-size: 9px;
  padding: 10px 14px;
  cursor: pointer;
}

.add:hover {
  background: var(--red);
  border-color: var(--red);
}

/* TASKS */

.task {
  display: grid;
  grid-template-columns: 25px 1fr auto;
  gap: 14px;
  align-items: center;
  min-height: 75px;
  border-bottom: 1px solid var(--line);
  transition: background .15s, padding .15s;
}

.task:hover {
  background: rgba(255,255,255,.15);
  padding-left: 5px;
}

.checkbox {
  width: 18px;
  height: 18px;
  border: 1px solid var(--ink);
  background: transparent;
  cursor: pointer;
  position: relative;
}

.task.done .checkbox {
  background: var(--red);
  border-color: var(--red);
}

.task.done .checkbox::after {
  content: "×";
  color: white;
  position: absolute;
  left: 4px;
  top: -2px;
}

.task-title {
  font-family: "Libre Baskerville", serif;
  font-size: 14px;
}

.task.done .task-title {
  color: var(--muted);
  text-decoration: line-through;
}

.meta {
  display: flex;
  gap: 12px;
  margin-top: 6px;
  color: var(--muted);
  font-size: 8px;
  text-transform: uppercase;
}

.meta .category {
  color: var(--red);
}

.actions {
  display: flex;
  gap: 5px;
}

.small-btn {
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.small-btn:hover {
  color: var(--ink);
}

.empty {
  text-align: center;
  padding: 55px 0;
  color: var(--muted);
  font-family: "Libre Baskerville", serif;
  font-style: italic;
}

.loading {
  padding: 35px 0;
  color: var(--muted);
  font-size: 9px;
}

/* MODAL */

.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 10;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-bg.open {
  display: flex;
}

.modal {
  width: min(470px, 100%);
  background: var(--white);
  border: 1px solid var(--ink);
  padding: 27px;
}

.modal h2 {
  font-family: "Libre Baskerville", serif;
  font-weight: 400;
  margin: 0 0 24px;
}

.field {
  margin-bottom: 17px;
}

label {
  display: block;
  color: var(--muted);
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--ink);
  padding: 9px 2px;
  font: 13px "Libre Baskerville", serif;
  outline: none;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 25px;
}

.cancel,
.save {
  padding: 10px 14px;
  font: inherit;
  font-size: 9px;
  cursor: pointer;
}

.cancel {
  border: 1px solid var(--line);
  background: transparent;
}

.save {
  border: 1px solid var(--ink);
  background: var(--ink);
  color: white;
}

.save:hover {
  background: var(--red);
  border-color: var(--red);
}

/* MOBILE */

@media (max-width: 650px) {

  main {
    padding-top: 25px;
  }

  header,
  .intro {
    display: block;
  }

  .header-date {
    text-align: left;
    margin-top: 18px;
  }

  .stats {
    margin-top: 25px;
  }

  .toolbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .task {
    grid-template-columns: 22px 1fr auto;
    gap: 10px;
  }
}
</style>
</head>

<body>

<main>

<header>

  <div>
    <h1>to-do dos <em>bobuxos</em></h1>
  </div>

  <div class="header-date">
    <span id="date"></span>
  </div>

</header>


<section class="intro">

  <div class="stats">

    <div class="stat">
      <strong id="total">0</strong>
      <span>coisas</span>
    </div>

    <div class="stat">
      <strong id="done">0</strong>
      <span>resolvidas</span>
    </div>

  </div>

</section>


<div class="toolbar">

  <div class="filters">

    <button class="filter active" data-filter="all">
      tudo
    </button>

    <button class="filter" data-filter="pending">
      pendentes
    </button>

    <button class="filter" data-filter="done">
      feitas
    </button>

    <button class="filter" data-filter="date">
      ir fazer
    </button>

    <button class="filter" data-filter="buy">
      comprar
    </button>

    <button class="filter" data-filter="watch">
      ver
    </button>

  </div>

  <button class="add" id="add">
    + adicionar coisa
  </button>

</div>


<section id="list">

  <div class="loading">
    abrindo o arquivo...
  </div>

</section>

</main>


<!-- MODAL -->

<div class="modal-bg" id="modal">

  <form class="modal" id="form">

    <h2 id="modalTitle">
      adicionar uma coisa
    </h2>

    <div class="field">

      <label>o que é?</label>

      <input
        id="title"
        required
        autocomplete="off"
        placeholder="ir naquele lugar que a gente falou"
      >

    </div>


    <div class="field">

      <label>categoria</label>

      <select id="category">

        <option value="date">
          IR FAZER
        </option>

        <option value="buy">
          COMPRAR
        </option>

        <option value="watch">
          VER
        </option>

        <option value="life">
          VIDA REAL
        </option>

      </select>

    </div>


    <div class="field">

      <label>quando?</label>

      <input
        id="when"
        placeholder="algum dia"
      >

    </div>


    <div class="modal-actions">

      <button
        type="button"
        class="cancel"
        id="cancel"
      >
        cancelar
      </button>

      <button class="save">
        guardar
      </button>

    </div>

  </form>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
  "https://olgqgraybbyakuskfnnf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3PNI02QrMQzpy9qbbRrdgw_JzmsWCuH";


/* =====================================
   ESTADO
===================================== */

let tasks = [];

let currentFilter = "all";

let editingId = null;


/* =====================================
   ELEMENTOS
===================================== */

const list =
  document.getElementById("list");

const modal =
  document.getElementById("modal");

const form =
  document.getElementById("form");


/* =====================================
   SUPABASE REQUEST
===================================== */

async function supabaseRequest(
  endpoint,
  options = {}
) {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${endpoint}`,
    {

      ...options,

      headers: {

        "apikey": SUPABASE_KEY,

        "Authorization":
          `Bearer ${SUPABASE_KEY}`,

        "Content-Type":
          "application/json",

        "Prefer":
          options.method === "POST"
            ? "return=representation"
            : "return=minimal",

        ...(options.headers || {})
      }

    }
  );


  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(error);
  }


  const text =
    await response.text();


  return text
    ? JSON.parse(text)
    : null;
}


/* =====================================
   CARREGAR
===================================== */

async function loadTasks() {

  try {

    tasks = await supabaseRequest(
      "tasks?select=*&order=created_at.desc"
    );

    render();

  } catch (error) {

    console.error(error);

    list.innerHTML = `
      <div class="loading">
        não conseguimos abrir o arquivo.<br><br>
        confira a tabela "tasks" no Supabase.
      </div>
    `;

  }

}


/* =====================================
   ADICIONAR
===================================== */

async function addTask(data) {

  await supabaseRequest(
    "tasks",
    {
      method: "POST",
      body: JSON.stringify(data)
    }
  );

  await loadTasks();
}


/* =====================================
   EDITAR
===================================== */

async function updateTask(id, data) {

  await supabaseRequest(
    `tasks?id=eq.${id}`,
    {
      method: "PATCH",
      body: JSON.stringify(data)
    }
  );

  await loadTasks();
}


/* =====================================
   APAGAR
===================================== */

async function deleteTask(id) {

  if (
    !confirm("apagar essa coisa?")
  ) return;


  await supabaseRequest(
    `tasks?id=eq.${id}`,
    {
      method: "DELETE"
    }
  );


  await loadTasks();
}


/* =====================================
   RENDER
===================================== */

function render() {

  let filtered =
    tasks.filter(task => {

      if (
        currentFilter === "pending"
      )
        return !task.done;


      if (
        currentFilter === "done"
      )
        return task.done;


      if (
        ["date", "buy", "watch"]
          .includes(currentFilter)
      )
        return (
          task.category === currentFilter
        );


      return true;

    });


  if (!filtered.length) {

    list.innerHTML = `
      <div class="empty">
        aparentemente não temos nada pra fazer.<br>
        suspeito.
      </div>
    `;

  } else {

    list.innerHTML =
      filtered.map(task => {

        const category = {

          date: "ir fazer",

          buy: "comprar",

          watch: "ver",

          life: "vida real"

        }[task.category]
        || "vida real";


        return `

          <article
            class="task ${task.done ? "done" : ""}"
          >

            <button
              class="checkbox"
              onclick="
                toggleTask(
                  ${task.id},
                  ${task.done}
                )
              "
              aria-label="concluir"
            ></button>


            <div>

              <div class="task-title">
                ${escapeHTML(task.title)}
              </div>


              <div class="meta">

                <span class="category">
                  ${category}
                </span>

                <span>
                  ${escapeHTML(
                    task.due || "sem data"
                  )}
                </span>

              </div>

            </div>


            <div class="actions">

              <button
                class="small-btn"
                onclick="
                  editTask(${task.id})
                "
                title="editar"
              >
                ···
              </button>


              <button
                class="small-btn"
                onclick="
                  deleteTask(${task.id})
                "
                title="apagar"
              >
                ×
              </button>

            </div>

          </article>

        `;

      }).join("");

  }


  updateStats();
}


/* =====================================
   CONCLUIR
===================================== */

async function toggleTask(
  id,
  current
) {

  await updateTask(
    id,
    {
      done: !current
    }
  );

}


/* =====================================
   EDITAR
===================================== */

function editTask(id) {

  const task =
    tasks.find(
      t => t.id === id
    );


  if (!task) return;


  editingId = id;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "editar uma coisa";


  document.getElementById(
    "title"
  ).value =
    task.title;


  document.getElementById(
    "category"
  ).value =
    task.category;


  document.getElementById(
    "when"
  ).value =
    task.due || "";


  modal.classList.add("open");


  document.getElementById(
    "title"
  ).focus();

}


/* =====================================
   ESTATÍSTICAS
===================================== */

function updateStats() {

  const total =
    tasks.length;


  const completed =
    tasks.filter(
      task => task.done
    ).length;


  document.getElementById(
    "total"
  ).textContent =
    total;


  document.getElementById(
    "done"
  ).textContent =
    completed;

}


/* =====================================
   ABRIR MODAL
===================================== */

document.getElementById(
  "add"
).onclick = () => {

  editingId = null;

  form.reset();


  document.getElementById(
    "modalTitle"
  ).textContent =
    "adicionar uma coisa";


  modal.classList.add("open");


  document.getElementById(
    "title"
  ).focus();

};


/* =====================================
   FECHAR MODAL
===================================== */

document.getElementById(
  "cancel"
).onclick = () => {

  modal.classList.remove("open");

  editingId = null;

};


modal.onclick = event => {

  if (
    event.target === modal
  ) {

    modal.classList.remove(
      "open"
    );

    editingId = null;

  }

};


/* =====================================
   FORMULÁRIO
===================================== */

form.onsubmit =
  async event => {

    event.preventDefault();


    const title =
      document.getElementById(
        "title"
      ).value.trim();


    const category =
      document.getElementById(
        "category"
      ).value;


    const due =
      document.getElementById(
        "when"
      ).value.trim();


    try {

      if (editingId) {

        await updateTask(
          editingId,
          {
            title,
            category,
            due
          }
        );

      } else {

        await addTask(
          {
            title,
            category,
            due,
            done: false
          }
        );

      }


      form.reset();

      modal.classList.remove(
        "open"
      );

      editingId = null;


    } catch (error) {

      console.error(error);

      alert(
        "não deu pra guardar. veja o console."
      );

    }

  };


/* =====================================
   FILTROS
===================================== */

document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.onclick = () => {

      document
        .querySelectorAll(".filter")
        .forEach(
          b =>
            b.classList
              .remove("active")
        );


      button.classList.add(
        "active"
      );


      currentFilter =
        button.dataset.filter;


      render();

    };

  });


/* =====================================
   ESCAPAR HTML
===================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================
   DATA
===================================== */

const now =
  new Date();


document.getElementById(
  "date"
).textContent =

  String(
    now.getDate()
  ).padStart(2, "0")

  + "."

  + String(
    now.getMonth() + 1
  ).padStart(2, "0")

  + "."

  + String(
    now.getFullYear()
  ).slice(-2);


/* =====================================
   ATUALIZA A CADA 5 SEGUNDOS
===================================== */

setInterval(
  loadTasks,
  5000
);


/* =====================================
   INICIAR
===================================== */

loadTasks();

</script>

</body>
</html>
